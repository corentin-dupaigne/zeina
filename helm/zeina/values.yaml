replicaCount: 1

image:
  repository: "ghcr.io/corentin-dupaigne/zeina/zeina"
  # Managed by .github/workflows/release.yml: pushing a vX.Y.Z tag rewrites
  # this to X.Y.Z on main, which is what triggers the Argo CD sync.
  # Do not set this back to a mutable tag.
  tag: "prod"
  pullPolicy: "IfNotPresent"

hostname: "girlfriend.corentindupaigne.com"

gateway:
  name: gateway
  namespace: default

servicePort: 80
containerPort: 80
